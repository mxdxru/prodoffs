# Implementation plan for H3 (vehicle-id: hybrid_layer_measured), 14 team-weeks.
# Effort split from business_case.md: 12 team-weeks for layer, vendor adapter, VIN entry and S-009 migration
# (instrumentation and holdout inside), 2 team-weeks for VIN landing pages. Week 1 starts 30 Nov 2026;
# spring season starts mid-March (around week 15).
effort_team_weeks: 14
plan:
  - step: "Define own vehicle-ID schema and mapping table from supplier and vendor IDs; catalog team named owner of the vehicle-ID service"
    owner: cto
    weeks: "1-2"
    done_when: "Schema merged, supplier and vendor IDs map to our vehicle IDs with mismatch alerts, owning team recorded before any VIN-entry work starts"
  - step: "Sign vendor contract keyed to our vehicle IDs: fee growth capped at 5% a year, 12-month exit clause, match confidence and raw attributes returned, volume tier above 100k lookups a month"
    owner: ceo
    weeks: "1-3"
    done_when: "Contract signed with the 5% yearly price cap, exit clause and confidence scores; no exclusivity"
  - step: "Vehicle-ID layer service and vendor adapter, then VIN entry in search and cart through the layer only: dropdown prefilled on a miss, one clarifying question on ambiguous matches, VIN cache per garage account"
    owner: cpo
    weeks: "3-6"
    done_when: "VIN entry live for all non-holdout customers by end of week 6 (mid-January); every VIN resolves to our vehicle ID and no vendor ID is stored outside the layer"
  - step: "Instrumentation and 10% holdout from launch day: VIN entry, hit rate, match confidence, conversion, checkout completion and wrong-fitment returns by vehicle source"
    owner: cdo
    weeks: "5-14"
    done_when: "Dashboard live on launch day; holdout runs exactly 8 weeks from launch and is switched off by end of week 14; readout compares results with business_case.md assumptions"
  - step: "VIN landing pages for the top 50 paid-search vehicle queries, VIN field on product pages; scoped 'fit guaranteed' claim held back until precision is measured"
    owner: cmo
    weeks: "5-8"
    done_when: "Landing pages live within 2 team-weeks; public guarantee only after measured precision on our catalog reaches 0.98 in the holdout readout"
  - step: "Migrate search, cart and returns off supplier IDs onto our vehicle IDs"
    owner: cto
    weeks: "7-12"
    done_when: "Zero reads of supplier or vendor vehicle IDs in search, cart and returns; S-009 marked fixed in memory/shortcuts.yaml before the spring season"
  - step: "Month-9 go/no-go on own home-market decoding from measured lookup volume, vendor spend, hit rate and precision"
    owner: ceo
    weeks: "36-39"
    done_when: "Decision recorded; on go, own home-market decoding is added to candidates.yaml as a separate candidate with its own effort, licences and owning team"
success_metrics:
  - metric: "Search-to-order conversion of VIN-identified sessions versus holdout"
    baseline: "3.8% (vehicle unknown)"
    target: "4.8% or higher"
    measured_by: "cdo, 8-week holdout readout, week 14"
  - metric: "Checkout completion uplift on orders from VIN-identified sessions"
    baseline: "holdout completion rate"
    target: "+2% or more versus holdout"
    measured_by: "cdo, 8-week holdout readout, week 14"
  - metric: "Wrong-fitment return rate on VIN-identified orders"
    baseline: "about 7.7% of orders (17% returns, 45% fitment-related)"
    target: "about 3.1% or lower (60% of fitment returns removed, scaled by 0.985 precision)"
    measured_by: "cdo, monthly from launch; returns lag, so first firm read at week 14"
  - metric: "VIN hit rate and precision measured on our catalog"
    baseline: "vendor claim: hit rate 0.95, precision 0.985"
    target: "hit rate at least 0.95 and precision at least 0.985; below 0.975 triggers the CDO dissent"
    measured_by: "cdo, weekly from launch"
